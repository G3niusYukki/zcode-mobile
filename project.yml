name: ZCodeMobile
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ZCodeMobileCore:
    path: Packages/ZCodeMobileCore

targets:
  ZCodeMobileLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - ZCodeMobileLiveActivity
      - ZCodeMobile/LiveActivity/SessionActivityAttributes.swift
    info:
      path: ZCodeMobileLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: ZCode Mobile 实时活动
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.example.ZCodeMobile.liveactivity
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  ZCodeMobile:
    type: application
    platform: iOS
    sources: [ZCodeMobile]
    dependencies:
      - package: ZCodeMobileCore
      - target: ZCodeMobileLiveActivity
        embed: true
    info:
      path: ZCodeMobile/Info.plist
      properties:
        CFBundleDisplayName: ZCode Mobile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 扫描桌面端 ZCode 显示的配对二维码
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
