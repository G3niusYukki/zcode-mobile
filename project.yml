name: ZCodeMobile
options:
  bundleIdPrefix: dev.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  ZCodeMobileCore:
    path: Packages/ZCodeMobileCore

targets:
  ZCodeMobile:
    type: application
    platform: iOS
    sources: [ZCodeMobile]
    dependencies:
      - package: ZCodeMobileCore
    info:
      path: ZCodeMobile/Info.plist
      properties:
        CFBundleDisplayName: ZCode Mobile
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 扫描桌面端 ZCode 显示的配对二维码
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
